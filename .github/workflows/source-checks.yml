name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_installers:
        description: Verify the staged release installers
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - name: Check official desktop Node.js binary
        run: node --input-type=module -e "import { verifyNodeRuntime } from './pc/scripts/dependency-license-resources.mjs'; verifyNodeRuntime(process.execPath)"
      - run: node pc/scripts/check-source-safety.mjs
      - run: node --test pc/scripts/check-source-safety.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download staged release assets for installer regression
        if: inputs.verify_installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(node -p "require('./latest-release.json').releaseTag")
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .assets[] | [.name,.id] | @tsv" > "$assets/list.tsv"
          while IFS=$'\t' read -r name id; do
            case "$name" in
              HachimiDock_*_FULL-FACTORY.zip) ;;
              HachimiDock_*_Windows-x64-setup.exe) [[ "$RUNNER_OS" == Windows ]] || continue ;;
              *) continue ;;
            esac
            [[ "$name" =~ ^[a-zA-Z0-9._-]+$ && "$id" =~ ^[0-9]+$ ]]
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$assets/$name"
          done < "$assets/list.tsv"
      - name: Stage verified firmware for all four board profiles
        shell: bash
        env:
          VERIFY_INSTALLERS: ${{ inputs.verify_installers }}
        run: |
          if [[ "$VERIFY_INSTALLERS" == true ]]; then
            python pc/scripts/stage-release-firmware.py --assets-dir "$RUNNER_TEMP/release-assets"
          else
            python pc/scripts/stage-release-firmware.py
          fi
      - name: Install and start the Windows release
        if: runner.os == 'Windows' && inputs.verify_installers
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $release = Get-Content latest-release.json -Raw | ConvertFrom-Json
          $asset = $release.artifacts | Where-Object role -eq windows
          $installer = Join-Path (Join-Path $env:RUNNER_TEMP 'release-assets') $asset.file
          ./pc/scripts/smoke-release-windows.ps1 -Installer $installer -ExpectedSha256 $asset.sha256 -Version $release.desktopVersion
      - run: npm ci
        working-directory: pc
      - run: npm test
        working-directory: pc
      - name: Build and exercise the Win32 ACL verifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ x64 toolchain unavailable' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $batch = Join-Path $env:RUNNER_TEMP 'build-hachimi-windows-acl.cmd'
          @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b 1
          node pc/scripts/build-windows-acl.mjs
          exit /b %errorlevel%
          "@ | Set-Content -Encoding ascii $batch
          & $batch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = 'pc/src-tauri/generated-runtime/windows-acl.exe'
          New-Item -ItemType Directory -Path 'pc/src-tauri/dsh-bridge' -Force | Out-Null
          Copy-Item $helper 'pc/src-tauri/dsh-bridge/windows-acl.exe'
          Copy-Item $helper 'integrations/dsh-hachimodock/windows-acl.exe'
          node --test integrations/dsh-hachimodock/test/windows-acl.test.js integrations/dsh-hachimodock/test/managed-install.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows composer and focus handling
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./pc/scripts/test-windows-composer.ps1
      - run: npm run test:bridge
        working-directory: pc
        timeout-minutes: 10
      - run: npm run build:web
        working-directory: pc
      - name: Run full native Windows regression with installed resources
        if: runner.os == 'Windows' && inputs.verify_installers
        shell: pwsh
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: |
          $env:PETUI_TEST_RESOURCES = Join-Path $env:RUNNER_TEMP 'petui-release-resources'
          cargo test --locked --manifest-path pc/src-tauri/Cargo.toml --lib
      - name: Exercise native font delivery, speech streaming and Python components
        if: runner.os != 'Windows' || !inputs.verify_installers
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: |
          set -euo pipefail
          for suite in shared_font:: openai_tts:: component_python::; do
            cargo test --locked --manifest-path pc/src-tauri/Cargo.toml --lib "$suite"
          done
  firmware-host:
    runs-on: ubuntu-latest
    env:
      CLANG: clang-20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select the reproducible WASM toolchain
        run: |
          test -x /usr/lib/llvm-20/bin/clang
          test -x /usr/lib/llvm-20/bin/wasm-ld
          /usr/lib/llvm-20/bin/clang --version
          /usr/lib/llvm-20/bin/wasm-ld --version
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
      - run: python -m pip install Pillow pytest platformio==6.1.19
      - name: Restore locked SDK downloads
        id: sdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ${{ runner.temp }}/p4-v3-core
            ${{ runner.temp }}/p4-ci-inputs/*.tar.gz
          key: p4-sdk-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies*.lock', 'firmware/tools/prepare_ci_sdk.py') }}
          restore-keys: p4-sdk-${{ runner.os }}-
      - name: Prepare pinned WAMR and locked v1, v3 and Hosted SDK test inputs
        run: python firmware/tools/prepare_ci_sdk.py --v3-core "$RUNNER_TEMP/p4-v3-core" --input-cache "$RUNNER_TEMP/p4-ci-inputs"
      - name: Save prepared SDK inputs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ${{ runner.temp }}/p4-v3-core
            ${{ runner.temp }}/p4-ci-inputs/*.tar.gz
          key: p4-sdk-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/dependencies*.lock', 'firmware/tools/prepare_ci_sdk.py') }}
      - name: Fetch only locked radio host harness dependencies
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu --manifest-path firmware/tests/radio_pc_lifecycle_harness/Cargo.toml
      - run: python -m pytest firmware/tests -q
      - run: python firmware/tests/protocol_contract_test.py
      - run: python firmware/tools/build_builtin_bundle.py --check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Verify the scoped scanner exception
        run: python3 pc/scripts/check-gitleaks-policy.py --scanner "$RUNNER_TEMP/gitleaks"
      - run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
